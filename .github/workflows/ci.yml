name: Build and push Docker image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: face-estimator:ci

      - name: Verify container starts and models are ready
        run: |
          docker run --detach --name face-estimator-ci --publish 8000:8000 face-estimator:ci
          trap 'docker logs face-estimator-ci || true; docker rm --force face-estimator-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health > health.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; health=json.load(open('health.json')); assert health.get('status') == 'ok' and health.get('models_ready') is True and health.get('attribute_model') == 'snakajima/face-lens' and health.get('attribute_model_revision') == 'd8e2c4cafb5e14a258202d8f5176973d25a244df', health; print(health)"

      - name: Tag verified image
        run: |
          docker tag face-estimator:ci "${DOCKERHUB_USERNAME}/face-estimator:latest"
          docker tag face-estimator:ci "${DOCKERHUB_USERNAME}/face-estimator:${GITHUB_SHA}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Push verified images to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "${DOCKERHUB_USERNAME}/face-estimator:latest"
          docker push "${DOCKERHUB_USERNAME}/face-estimator:${GITHUB_SHA}"
