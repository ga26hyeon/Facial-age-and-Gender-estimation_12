name: Deploy Docker image to Windows runner

on:
  workflow_run:
    workflows: ["Build and push Docker image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: face-estimator-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Docker Engine without changing the running host service
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerDir = Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\resources\bin'
          $dockerExe = Join-Path $dockerDir 'docker.exe'
          if (-not (Test-Path -LiteralPath $dockerExe)) { throw "Docker CLI not found for runner account: $dockerExe" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dockerDir
          Write-Host "Runner Docker context: $(& $dockerExe context show)"
          $dockerOutput = & $dockerExe version 2>&1
          $dockerExitCode = $LASTEXITCODE
          $dockerText = $dockerOutput -join "`n"
          Write-Host $dockerText
          if ($dockerExitCode -ne 0 -or $dockerText -notmatch 'Server:') {
            Write-Host "docker version exit code: $dockerExitCode"
            & $dockerExe desktop status
            & $dockerExe desktop logs --priority 2 --since 20m --no-color
            throw 'Docker Engine is unavailable. Start Docker Desktop manually; this job deliberately did not restart it or change the current service.'
          }
          try {
            $legacy = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 4
            Write-Host "Existing endpoint before deployment: http=200, status=$($legacy.status), model_revision=$($legacy.attribute_model_revision)."
          } catch {
            Write-Host "Existing endpoint preflight at 127.0.0.1:8000 was unavailable: $($_.Exception.Message). No action will be taken on that port."
          }
          # 8081 is reserved for the new local endpoint; never take over another listener.
          $listeners = Get-NetTCPConnection -State Listen -LocalPort 8081 -ErrorAction SilentlyContinue
          if ($listeners -and -not (& $dockerExe ps --all --quiet --filter 'name=^/face-estimator-proxy$')) {
            throw 'Port 8081 is already owned by a non-deployment process. Existing services were left untouched.'
          }

      - name: Start independent analysis API monitor before deployment
        id: monitor_start
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          MONITOR_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $runDir = Join-Path $env:RUNNER_TEMP "face-estimator-redeploy-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $runDir -Force | Out-Null
          $log = Join-Path $runDir 'redeployment-check.log'
          $phase = Join-Path $runDir 'phase.txt'
          $stop = Join-Path $runDir 'stop.txt'
          $pidPath = Join-Path $runDir 'monitor.pid'
          $image = Join-Path $runDir 'fixed-analysis-probe.jpg'
          Remove-Item $log, $phase, $stop, $pidPath, $image -Force -ErrorAction SilentlyContinue
          [IO.File]::WriteAllText($log, (([ordered]@{type='monitor_setup';utc=[DateTime]::UtcNow.ToString('o');session=$env:MONITOR_SESSION;endpoint='http://127.0.0.1:8081/api/analyze'} | ConvertTo-Json -Compress) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8081/api/health' -TimeoutSec 5
          if ($health.status -ne 'ok' -or $health.models_ready -ne $true) { throw 'Stable endpoint is not healthy; deployment has not started.' }
          # Reuse a local-only, fixed image already present on this self-hosted runner.
          # If the fixture is unavailable, generate a deterministic image without committing evaluation data.
          $desktopName = -join ([char[]]@(0xBC14, 0xD0D5, 0x20, 0xD654, 0xBA74))
          $fixtureRelative = "OneDrive\$desktopName\face_estimator(22)\upload\evaluation\data\images\001.jpg"
          $fixture = Join-Path $env:USERPROFILE $fixtureRelative
          if (Test-Path -LiteralPath $fixture) {
            Copy-Item -LiteralPath $fixture -Destination $image
            Write-Host 'Monitor will reuse the runner-local fixed face image; it is not copied into the repository or artifact.'
          } else {
            Add-Type -AssemblyName System.Drawing
            $image = Join-Path $runDir 'fixed-analysis-probe.bmp'
            $bitmap = [System.Drawing.Bitmap]::new(256, 256)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::FromArgb(244, 244, 244))
              $random = [System.Random]::new(1208)
              for ($i = 0; $i -lt 700; $i++) {
                $x = $random.Next(0, 256); $y = $random.Next(0, 256); $shade = $random.Next(150, 230)
                $bitmap.SetPixel($x, $y, [System.Drawing.Color]::FromArgb($shade, $shade, $shade))
              }
              $bitmap.Save($image, [System.Drawing.Imaging.ImageFormat]::Bmp)
            } finally { $graphics.Dispose(); $bitmap.Dispose() }
          }
          [IO.File]::WriteAllText($phase, 'pre-deploy', [Text.UTF8Encoding]::new($false))
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\monitor-api.ps1'
          if (-not (Test-Path -LiteralPath $script)) { throw "Monitor script missing: $script" }
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $arguments = '-NoLogo -NoProfile -ExecutionPolicy Bypass -File "{0}" -ImagePath "{1}" -LogPath "{2}" -PhasePath "{3}" -StopPath "{4}" -SessionId "{5}"' -f $script, $image, $log, $phase, $stop, $env:MONITOR_SESSION
          $process = Start-Process -FilePath $powershell -ArgumentList $arguments -WindowStyle Hidden -PassThru
          Set-Content -LiteralPath $pidPath -Value $process.Id -NoNewline
          Write-Host "Independent monitor PID=$($process.Id); endpoint=http://127.0.0.1:8081/api/analyze; fixed image=$image"
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          $verified = $false
          while ([DateTime]::UtcNow -lt $deadline) {
            if (Test-Path -LiteralPath $log) {
              $rows = @(Get-Content -LiteralPath $log -Encoding UTF8 | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
              $first = @($rows | Where-Object { $_.type -eq 'request' } | Select-Object -First 1)
              if ($first.Count -and $first[0].http_status -eq 200 -and $first[0].analysis_ok -eq $true -and $first[0].revision_in_response -eq $true) { $verified = $true; break }
            }
            if (-not (Get-Process -Id $process.Id -ErrorAction SilentlyContinue)) { throw 'Independent monitor exited before writing a successful API record.' }
            Start-Sleep -Milliseconds 250
          }
          if (-not $verified) { throw 'No successful versioned analysis response was recorded before deployment; service was not changed.' }
          Write-Host "Pre-deployment independent monitor check: $($first[0] | ConvertTo-Json -Compress -Depth 8)"

      - name: Mark image pull and deployment observation phase
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $phase = Join-Path $env:RUNNER_TEMP "face-estimator-redeploy-$env:GITHUB_RUN_ID\phase.txt"
          [IO.File]::WriteAllText($phase, 'during-deploy', [Text.UTF8Encoding]::new($false))

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the CI-verified app and pinned proxy images
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "$($env:DOCKERHUB_USERNAME)/face-estimator:$($env:DEPLOY_SHA)"
          & docker pull $image
          if ($LASTEXITCODE -ne 0) { throw "Failed to pull CI image $image." }
          & docker pull caddy:2.11.7-alpine
          if ($LASTEXITCODE -ne 0) { throw 'Failed to pull pinned Caddy proxy image.' }

      - name: Verify candidate, switch the stable endpoint, and drain old requests
        id: deploy
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $network = 'face-estimator-net'
          $proxy = 'face-estimator-proxy'
          $caddyImage = 'caddy:2.11.7-alpine'
          $image = "$($env:DOCKERHUB_USERNAME)/face-estimator:$($env:DEPLOY_SHA)"
          $candidate = "face-estimator-$($env:GITHUB_RUN_ID)"
          $stageProxy = "face-estimator-proxy-stage-$($env:GITHUB_RUN_ID)"
          $stagePort = 58100 + [int]([long]$env:GITHUB_RUN_ID % 4000)
          $config = Join-Path $env:RUNNER_TEMP 'face-estimator.Caddyfile'
          $monitorFile = Join-Path $env:RUNNER_TEMP 'face-estimator-deploy-observations.jsonl'
          $stopFile = Join-Path $env:RUNNER_TEMP 'face-estimator-deploy-monitor.stop'
          $oldConfig = $null
          $oldBackends = @()
          $stoppedBackends = @()
          $switched = $false
          $stableProxyStarted = $false
          $candidateStarted = $false
          $candidateIsActive = $false
          $rollbackComplete = $true
          $monitor = $null

          function Write-Observation([string]$phase) {
            $row = [ordered]@{ time_utc = [DateTime]::UtcNow.ToString('o'); phase = $phase; address = 'http://127.0.0.1:8081/api/health' }
            try {
              $health = Invoke-RestMethod -Uri $row.address -TimeoutSec 3
              $row.status = $health.status
              $row.models_ready = $health.models_ready
              $row.app_revision = $health.app_revision
              $row.model_revision = $health.attribute_model_revision
              $row.face_crop_scale = $health.face_crop_scale
              $row.http = 200
            } catch { $row.http = 'unavailable'; $row.error = $_.Exception.Message }
            $line = $row | ConvertTo-Json -Compress
            Write-Host $line
            Add-Content -LiteralPath $monitorFile -Value $line
            return $row
          }

          function Test-Health([string]$uri, [string]$expectedRevision) {
            for ($i = 1; $i -le 60; $i++) {
              try {
                $health = Invoke-RestMethod -Uri $uri -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.models_ready -eq $true -and $health.attribute_model -eq 'snakajima/face-lens' -and $health.attribute_model_revision -eq 'd8e2c4cafb5e14a258202d8f5176973d25a244df' -and $health.face_crop_scale -eq 1.9 -and $health.app_revision -eq $expectedRevision) { return $true }
              } catch { }
              Start-Sleep -Seconds 2
            }
            return $false
          }

          function Set-Route([string]$container, [string]$backend) {
            "{`n    grace_period 3m`n}`n:80 {`n    reverse_proxy ${backend}:8000`n}`n" | Set-Content -LiteralPath $config -Encoding ascii
            & docker cp $config "${container}:/etc/caddy/Caddyfile"
            if ($LASTEXITCODE -ne 0) { throw "Failed to write proxy route to $backend." }
            & docker exec $container caddy reload --config /etc/caddy/Caddyfile
            if ($LASTEXITCODE -ne 0) { throw "Caddy reload failed while routing to $backend." }
          }

          try {
            Remove-Item $monitorFile, $stopFile -Force -ErrorAction SilentlyContinue
            $networks = @(& docker network ls --format '{{.Name}}')
            if ($LASTEXITCODE -ne 0) { throw 'Could not list Docker networks.' }
            if ($networks -notcontains $network) {
              & docker network create $network
              if ($LASTEXITCODE -ne 0) { throw 'Could not create app network.' }
            }

            $containers = @(& docker ps --all --format '{{.Names}}')
            if ($LASTEXITCODE -ne 0) { throw 'Could not list Docker containers.' }
            if ($containers -contains $candidate) { & docker rm --force $candidate; if ($LASTEXITCODE -ne 0) { throw 'Could not remove stale candidate with this run ID.' } }
            & docker run --detach --name $candidate --restart unless-stopped --network $network --label 'io.face-estimator.role=backend' --label "org.opencontainers.image.revision=$($env:DEPLOY_SHA)" --env "APP_REVISION=$($env:DEPLOY_SHA)" --stop-timeout 125 $image
            if ($LASTEXITCODE -ne 0) { throw "Could not start candidate $candidate." }
            $candidateStarted = $true

            # Stage the candidate behind a disposable proxy on another loopback port.
            $containers = @(& docker ps --all --format '{{.Names}}')
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh Docker container list before staging.' }
            if ($containers -contains $stageProxy) { & docker rm --force $stageProxy; if ($LASTEXITCODE -ne 0) { throw 'Could not remove stale staging proxy.' } }
            & docker run --detach --name $stageProxy --network $network --publish "127.0.0.1:${stagePort}:80" $caddyImage
            if ($LASTEXITCODE -ne 0) { throw 'Could not start staging proxy; stable address was not changed.' }
            Set-Route $stageProxy $candidate
            if (-not (Test-Health "http://127.0.0.1:${stagePort}/api/health" $env:DEPLOY_SHA)) {
              & docker logs $candidate
              & docker logs $stageProxy
              throw 'Candidate model/API check failed behind staging proxy; current services remain untouched.'
            }
            Write-Host "Candidate verified: revision=$($env:DEPLOY_SHA), address=http://127.0.0.1:${stagePort} (staging only)."

            $containers = @(& docker ps --all --format '{{.Names}}')
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh Docker container list before proxy selection.' }
            $proxyExists = ($containers -contains $proxy)
            if ($proxyExists) {
              $proxyRunning = & docker inspect --format '{{.State.Running}}' $proxy
              if ($proxyRunning -ne 'true') { throw 'Stable proxy exists but is stopped; refusing to disrupt existing services.' }
              $oldConfig = (& docker exec $proxy cat /etc/caddy/Caddyfile) -join "`n"
              if ($LASTEXITCODE -ne 0) { throw 'Could not read old proxy route; refusing to switch.' }
              $matches = [regex]::Matches($oldConfig, 'reverse_proxy\s+([A-Za-z0-9._-]+):8000')
              if ($matches.Count -eq 0) { throw 'Old route is unrecognized; refusing to switch.' }
              $oldBackends = @($matches | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique)

              # Poll the stable API during the switch and write timestamped evidence to job logs.
              $monitor = Start-Job -ArgumentList $monitorFile, $stopFile -ScriptBlock {
                param($outputPath, $haltPath)
                while (-not (Test-Path -LiteralPath $haltPath)) {
                  $row = [ordered]@{ time_utc = [DateTime]::UtcNow.ToString('o') }
                  try {
                    $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8081/api/health' -TimeoutSec 2
                    $row.http = 200; $row.status = $h.status; $row.models_ready = $h.models_ready; $row.app_revision = $h.app_revision
                  } catch { $row.http = 'error'; $row.error = $_.Exception.Message }
                  Add-Content -LiteralPath $outputPath -Value ($row | ConvertTo-Json -Compress)
                  Start-Sleep -Milliseconds 500
                }
              }
              Write-Observation 'before-switch'
              $switched = $true
              Set-Route $proxy $candidate
              if (-not (Test-Health 'http://127.0.0.1:8081/api/health' $env:DEPLOY_SHA)) {
                Set-Content -LiteralPath $config -Value $oldConfig -Encoding ascii
                & docker cp $config "${proxy}:/etc/caddy/Caddyfile"
                if ($LASTEXITCODE -ne 0) { throw 'Candidate failed; restoring old route failed. Old containers were not stopped.' }
                & docker exec $proxy caddy reload --config /etc/caddy/Caddyfile
                if ($LASTEXITCODE -ne 0) { throw 'Candidate failed; Caddy could not reload old route. Old containers were not stopped.' }
                $switched = $false
                throw 'Stable endpoint did not return candidate revision; prior backend route was restored.'
              }
              Write-Observation 'after-switch'
              $candidateIsActive = $true
            } else {
              # First install listens only on 8081; the existing app at port 8000 is never touched.
              $listeners = Get-NetTCPConnection -State Listen -LocalPort 8081 -ErrorAction SilentlyContinue
              if ($listeners) { throw 'Port 8081 became occupied; refusing to take over the listener.' }
              & docker run --detach --name $proxy --restart unless-stopped --network $network --publish '127.0.0.1:8081:80' $caddyImage
              if ($LASTEXITCODE -ne 0) { throw 'Could not start new proxy on 127.0.0.1:8081.' }
              $stableProxyStarted = $true
              Set-Route $proxy $candidate
              $switched = $true
              if (-not (Test-Health 'http://127.0.0.1:8081/api/health' $env:DEPLOY_SHA)) {
                & docker logs $proxy
                throw 'New endpoint failed health verification. Existing port 8000 service was left untouched.'
              }
              Write-Observation 'first-deployment-after-switch'
              $switched = $false
              $stableProxyStarted = $false
              $candidateIsActive = $true
            }

            # Caddy reload is graceful. Leave the old upstream available for 30 seconds,
            # verify the new route again, then let Uvicorn drain requests before removing it.
            if ($oldBackends.Count -gt 0) {
              Write-Host "Traffic is on revision $($env:DEPLOY_SHA); draining prior upstream(s) for 30 seconds."
              Start-Sleep -Seconds 30
              if (-not (Test-Health 'http://127.0.0.1:8081/api/health' $env:DEPLOY_SHA)) { throw 'New stable route failed during drain; previous backend is still running.' }
              foreach ($oldBackend in $oldBackends) {
                if ($oldBackend -ne $candidate) {
                  & docker stop --time 125 $oldBackend
                  if ($LASTEXITCODE -ne 0) { throw "Could not gracefully stop old backend $oldBackend; new backend remains active." }
                  $stoppedBackends += $oldBackend
                }
              }
              if (-not (Test-Health 'http://127.0.0.1:8081/api/health' $env:DEPLOY_SHA)) { throw 'New route failed after old backend drain; restoring the prior service.' }
              foreach ($oldBackend in $stoppedBackends) {
                & docker rm $oldBackend
                if ($LASTEXITCODE -ne 0) { throw "Could not remove drained old backend $oldBackend." }
              }
              $switched = $false
            }
            Write-Observation 'after-drain'
            if (-not (Test-Health 'http://127.0.0.1:8081/api/health' $env:DEPLOY_SHA)) { throw 'Final stable endpoint check failed.' }
            try {
              $legacyAfter = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 4
              Write-Host "Existing endpoint after deployment: http=200, status=$($legacyAfter.status), model_revision=$($legacyAfter.attribute_model_revision)."
            } catch { Write-Host "Existing endpoint 127.0.0.1:8000 post-check: $($_.Exception.Message). It was not modified by this workflow." }
            Write-Host "Deployment complete: http://127.0.0.1:8081/ -> $candidate (revision $($env:DEPLOY_SHA))."
          } catch {
            Write-Error $_
            $containers = @(& docker ps --all --format '{{.Names}}' 2>$null)
            if ($LASTEXITCODE -eq 0 -and $containers -contains $stageProxy) { & docker logs $stageProxy }
            if ($LASTEXITCODE -eq 0 -and $null -ne $oldConfig -and $containers -contains $proxy) { & docker logs $proxy }
            if ($switched -and $null -ne $oldConfig) {
              foreach ($oldBackend in $stoppedBackends) {
                & docker start $oldBackend
                if ($LASTEXITCODE -ne 0) { $rollbackComplete = $false }
              }
              Set-Content -LiteralPath $config -Value $oldConfig -Encoding ascii
              if ($rollbackComplete) { & docker cp $config "${proxy}:/etc/caddy/Caddyfile" }
              if ($LASTEXITCODE -ne 0) { $rollbackComplete = $false }
              if ($rollbackComplete) {
                & docker exec $proxy caddy reload --config /etc/caddy/Caddyfile
                if ($LASTEXITCODE -ne 0) { $rollbackComplete = $false }
              }
              if ($rollbackComplete) { $candidateIsActive = $false; Write-Host 'Rolled back to the previous route; previous container remains available.' }
              else { Write-Error 'Rollback failed; keeping the candidate container running so the active route is not orphaned.' }
            }
            if ($stableProxyStarted) { & docker rm --force $proxy }
            if ($candidateStarted -and -not $candidateIsActive -and $rollbackComplete) { & docker logs $candidate 2>$null; & docker rm --force $candidate 2>$null }
            throw
          } finally {
            $containers = @(& docker ps --all --format '{{.Names}}' 2>$null)
            if ($LASTEXITCODE -eq 0 -and $containers -contains $stageProxy) { & docker rm --force $stageProxy }
            if ($monitor) {
              New-Item -ItemType File -Path $stopFile -Force | Out-Null
              Wait-Job $monitor -Timeout 10 | Out-Null
              Stop-Job $monitor -ErrorAction SilentlyContinue
              Remove-Job $monitor -Force -ErrorAction SilentlyContinue
              Write-Host 'Timestamped deployment observations (before/during/after):'
              if (Test-Path $monitorFile) { Get-Content $monitorFile }
            }
            Remove-Item $config -Force -ErrorAction SilentlyContinue
            Remove-Item $stopFile -Force -ErrorAction SilentlyContinue
          }

      - name: Keep independent monitor running for 30 seconds after deployment result
        if: ${{ always() && steps.monitor_start.outcome == 'success' }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          $runDir = Join-Path $env:RUNNER_TEMP "face-estimator-redeploy-$env:GITHUB_RUN_ID"
          $phase = Join-Path $runDir 'phase.txt'
          $log = Join-Path $runDir 'redeployment-check.log'
          $value = if ($env:DEPLOY_OUTCOME -eq 'success') { 'post-deploy' } else { 'deployment-failed' }
          [IO.File]::WriteAllText($phase, $value, [Text.UTF8Encoding]::new($false))
          $result = [ordered]@{ type = 'deployment_result'; utc = [DateTime]::UtcNow.ToString('o'); outcome = $env:DEPLOY_OUTCOME; phase = $value; run_id = $env:GITHUB_RUN_ID } | ConvertTo-Json -Compress
          [IO.File]::AppendAllText($log, $result + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          Write-Host "Continuing independent API requests for 30 seconds after deployment outcome: $($env:DEPLOY_OUTCOME)."
          Start-Sleep -Seconds 30

      - name: Stop independent monitor
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $runDir = Join-Path $env:RUNNER_TEMP "face-estimator-redeploy-$env:GITHUB_RUN_ID"
          $stop = Join-Path $runDir 'stop.txt'
          $pidPath = Join-Path $runDir 'monitor.pid'
          if (Test-Path -LiteralPath $pidPath) {
            [IO.File]::WriteAllText($stop, 'stop', [Text.UTF8Encoding]::new($false))
            $monitorPid = [int](Get-Content -LiteralPath $pidPath -Raw)
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while ([DateTime]::UtcNow -lt $deadline -and (Get-Process -Id $monitorPid -ErrorAction SilentlyContinue)) { Start-Sleep -Milliseconds 250 }
            if (Get-Process -Id $monitorPid -ErrorAction SilentlyContinue) { Stop-Process -Id $monitorPid -Force; Write-Warning "Stopped monitor PID $monitorPid after its stop marker timed out." }
          }

      - name: Write request evidence to Actions log and job Summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          $runDir = Join-Path $env:RUNNER_TEMP "face-estimator-redeploy-$env:GITHUB_RUN_ID"
          $log = Join-Path $runDir 'redeployment-check.log'
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\write-deployment-summary.ps1'
          $outcome = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_OUTCOME)) { 'not-run' } else { $env:DEPLOY_OUTCOME }
          if (Test-Path -LiteralPath $script) {
            & $script -LogPath $log -RunId $env:GITHUB_RUN_ID -CiRunId $env:CI_RUN_ID -Repository $env:GITHUB_REPOSITORY -ServerUrl $env:GITHUB_SERVER_URL -DeployOutcome $outcome
          } else {
            $message = "# Face Estimator deployment verification`n`nWorkflow checkout did not provide the summary script. Deployment outcome: $outcome.`n"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message
            Write-Output $message
          }

      - name: Upload UTF-8 deployment evidence even when deployment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redeployment-check-${{ github.run_id }}
          path: ${{ runner.temp }}/face-estimator-redeploy-${{ github.run_id }}/redeployment-check.log
          if-no-files-found: warn
          retention-days: 30
